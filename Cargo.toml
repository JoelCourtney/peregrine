[package]
name = "peregrine"
version = "0.2.0"
edition = "2024"

authors = ["Joel Courtney <joel.e.courtney@gmail.com>"]
description = "A discrete event simulation engine similar to NASA-AMMOS's Aerie-Merlin."
readme = "README.md"
repository = "https://github.com/JoelCourtney/peregrine"
license = "MIT OR Apache-2.0"
keywords = ["simulation"]
categories = ["aerospace::simulation", "simulation"]

[features]

[dependencies]
forte = "1.0.0-alpha.4"
type-map = "0.5"
ahash = "0.8"
dashmap = "6.1"
derive_more = { version = "2.0", features = ["deref", "deref_mut"] }
parking_lot = { version = "0.12", features = ["send_guard"] }
quick_cache = "0.6"
async-lock = "3.4"
peregrine_macros = { path = "peregrine_macros" }
futures = { version = "0.3.31", default-features = false, features = ["std"] }
slotmap = "1.0.7"
replace_with = "0.1.8"
oneshot = "0.1.11"
crossbeam = "0.8.4"

[dev-dependencies]
hifitime = "4.1.3"
itertools = "0.14"

[workspace]
members = [".", "peregrine_macros"]
