[package]
name = "desparrow"
version = "0.2.0"
edition = "2024"

authors = ["Joel Courtney <joel.e.courtney@gmail.com>"]
description = "A discrete event simulation engine similar to NASA-AMMOS's Aerie-Merlin."
readme = "README.md"
repository = "https://github.com/JoelCourtney/desparrow"
license = "MIT OR Apache-2.0"
keywords = ["simulation"]
categories = ["aerospace::simulation", "simulation"]

[features]

[dependencies]
forte = "1.0.0-alpha.4"
parking_lot = { version = "0.12" }
desparrow_macros = { path = "desparrow_macros" }
oneshot = "0.1.11"
replace_with = "0.1.8"
petgraph = { version = "0.8.3", default-features = false, features = ["stable_graph"] }
lazy_static = "1.5.0"
crossbeam = { version = "0.8.4", default-features = false }
array-init = "2.1.0"
derive_more = { version = "2.1.0", features = ["deref"] }

[dev-dependencies]

[workspace]
members = [".", "desparrow_macros"]
