[package]
name = "peregrine"
version = "0.2.0"
edition = "2024"

authors = ["Joel Courtney <joel.e.courtney@gmail.com>"]
description = "A discrete event simulation engine similar to NASA-AMMOS's Aerie-Merlin."
readme = "README.md"
repository = "https://github.com/JoelCourtney/peregrine"
license = "MIT OR Apache-2.0"
keywords = ["simulation"]
categories = ["aerospace::simulation", "simulation"]

[features]

[dependencies]
parking_lot = "0.12"
peregrine_macros = { path = "peregrine_macros" }
oneshot = "0.1"
replace_with = "0.1"
petgraph = { version = "0.8", default-features = false, features = ["stable_graph"] }
lazy_static = "1.5"
crossbeam = { version = "0.8", default-features = false }
array-init = "2.1"
derive_more = { version = "2.1", features = ["deref", "deref_mut"] }
slotmap = "1.1"
typetag = "0.2"
hifitime = { version = "4.2" }
serde = "1.0"
rayon = "1.11"
num = "0.4"

[dev-dependencies]
ordered-float = "5.1"

[workspace]
members = [".", "peregrine_macros"]
